<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palabras</title>
<link rel="artifact-thumbnail" href="thumb.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, phone first. Summary on top, one big action, details below. */
:root{
  --bg:#f3f4f9; --surface:#ffffff; --ink:#151b36; --muted:#5d6482; --line:#dfe2ee;
  --accent:#2845c8; --accent-ink:#ffffff; --accent-soft:#e4e9ff;
  --good:#1f8a5b; --bad:#c43d3d; --m:#2a6fd6; --f:#d6428a; --good-soft:#e1f4ea; --bad-soft:#fbe6e6;
  --b0:#d5d9ea; --b1:#e0564a; --b2:#e8963f; --b3:#d9c44a; --b4:#7bbf6a; --b5:#3f9d8f; --b6:#2845c8;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'DM Sans',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1222; --surface:#171d33; --ink:#e8eaf6; --muted:#9aa2c4; --line:#2a3250;
    --accent:#8da2ff; --accent-ink:#0e1222; --accent-soft:#222c55;
    --good:#4cc38a; --bad:#ef7d7d; --m:#7fb0ff; --f:#ff8ec2; --good-soft:#16382b; --bad-soft:#3d2125;
    --b0:#2a3250; --b1:#e8685c; --b2:#eda253; --b3:#dccb5c; --b4:#86c875; --b5:#52b3a4; --b6:#8da2ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1222; --surface:#171d33; --ink:#e8eaf6; --muted:#9aa2c4; --line:#2a3250;
  --accent:#8da2ff; --accent-ink:#0e1222; --accent-soft:#222c55;
  --good:#4cc38a; --bad:#ef7d7d; --m:#7fb0ff; --f:#ff8ec2; --good-soft:#16382b; --bad-soft:#3d2125;
  --b0:#2a3250; --b1:#e8685c; --b2:#eda253; --b3:#dccb5c; --b4:#86c875; --b5:#52b3a4; --b6:#8da2ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:28px;letter-spacing:-.01em}
h2{font-size:18px;margin-bottom:10px}
.top{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.sub{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1}
.tabs[hidden]{display:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tab{border:0;background:transparent;padding:9px 4px;font-size:15px;border-radius:9px;font-weight:500;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.tile b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:15px;padding:11px 14px}
.btn.small{display:inline-block;width:auto;font-size:15px;padding:10px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{color:var(--muted);font-size:14px;margin:8px 0 0}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--b0);margin:6px 0 12px}
.bar i{display:block;height:100%}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.legend li{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center}
.legend .sw{width:14px;height:14px;border-radius:4px}
.legend small{color:var(--muted)}
.legend b{font-variant-numeric:tabular-nums}
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:84px}
.fc div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted);gap:3px}
.fc i{display:block;width:100%;max-width:30px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:3px;opacity:.85}
.fc em{font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums;font-size:12px;min-height:14px}
/* session */
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 14px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.sesshead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;color:var(--muted)}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 18px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;margin-bottom:14px}
.dirtag{font-size:13px;color:var(--muted);letter-spacing:.02em}
.word{font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,48px);line-height:1.1;overflow-wrap:anywhere;text-wrap:balance}
.word.de{font-size:clamp(24px,7vw,32px);font-weight:500}
.ans .sub2{display:block;font-size:13px;color:var(--muted);font-family:var(--body);font-weight:400;margin-top:4px}
.ans{border-top:1px solid var(--line);padding-top:12px;width:100%;font-size:22px;font-family:var(--display);font-weight:500;overflow-wrap:anywhere}
.art.m{color:var(--m)}
.art.f{color:var(--f)}
.art{font-weight:500}
.ex{width:100%;margin-top:4px;padding-top:12px;border-top:1px solid var(--line);font-family:var(--body);font-weight:400;text-align:center}
.ex .es{display:block;font-size:15px;color:var(--ink)}
.ex .es b{font-weight:700;color:var(--accent)}
.exde{font-size:14px;color:var(--muted);max-width:30ch;text-wrap:balance}
.chip{display:inline-block;font-size:12px;border-radius:99px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.say{border:1px solid var(--line);background:transparent;border-radius:99px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;gap:2px;align-items:center;font-weight:700}
.grade small{font-weight:400;color:var(--muted);font-size:12px}
.grade.again{border-color:var(--bad);color:var(--bad)}
.grade.easy{border-color:var(--good);color:var(--good)}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
/* words */
.search{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:34px 1fr 12px;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item[data-act]{cursor:pointer}
.item .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.item b{display:block;font-weight:700}
.item span{color:var(--muted);font-size:14px}
.item .dot{width:10px;height:10px;border-radius:50%}
/* settings */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px 14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.field{width:90px;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.store{color:var(--muted);font-size:13px;text-align:center;margin-top:18px}
.danger{color:var(--bad);border-color:var(--bad)}
.x-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.x-stats b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.x-stats span{font-size:13px;color:var(--muted)}
.x-stack{display:grid;gap:10px;margin-bottom:6px}
.x-two{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.x-two span{font-weight:400;font-size:13px;opacity:.85}
.x-task{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 16px;margin-bottom:14px}
.x-label{display:inline-block;font-size:12px;border-radius:99px;padding:3px 10px;background:var(--accent-soft);color:var(--accent);font-weight:700;margin:0 6px 12px 0}
.x-label.again{background:var(--bad-soft);color:var(--bad)}
.x-prompt{font-family:var(--display);font-size:clamp(22px,6.4vw,28px);line-height:1.3;font-weight:500;overflow-wrap:anywhere;text-wrap:balance}
.x-typed{margin-top:16px}
.x-typed textarea{width:100%;font:inherit;font-size:19px;line-height:1.35;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:none}
.x-typed textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.x-typed textarea:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}
.x-typed textarea.good{border-color:var(--good);background:var(--good-soft)}
.x-typed textarea.bad{border-color:var(--bad);background:var(--bad-soft)}
.x-keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.x-key{min-width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:20px;font-weight:500;padding:0 8px;display:inline-flex;align-items:center;justify-content:center}
.x-key:active{background:var(--accent-soft)}
.x-fb{border-radius:14px;padding:12px 14px;margin:14px 0 0;border:1px solid var(--line)}
.x-fb.good{background:var(--good-soft);border-color:var(--good)}
.x-fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.x-fb strong{display:block;font-family:var(--display);font-size:17px;margin-bottom:4px}
.x-sol{display:block;font-family:var(--display);font-size:21px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.x-miss{background:transparent;color:var(--bad);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}
.x-nt{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.x-actions{display:flex;gap:8px;margin-top:14px}
.x-actions .btn{flex:1}
.x-score{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
.x-miss-row{padding:8px 0;border-top:1px solid var(--line)}
.x-miss-row:first-of-type{border-top:0}
.x-miss-row b{display:block} .x-miss-row span{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: reduce){ .prog i{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>Palabras</h1><span class="sub">800 häufigste Wörter</span></header>
  <nav id="tabs" class="tabs" aria-label="Ansicht">
    <button class="tab" data-act="view" data-v="home" type="button">Lernen</button>
    <button class="tab" data-act="view" data-v="ex" type="button">Übungen</button>
    <button class="tab" data-act="view" data-v="words" type="button">Wörter</button>
    <button class="tab" data-act="view" data-v="settings" type="button">Einstellungen</button>
  </nav>
  <main id="main"></main>
  <p id="store" class="store"></p>
</div>

const N = WORDS.length;
const INT = [0,0,1,3,7,14,30];            // Tage bis zur nächsten Abfrage, je Box
const BOXNAME = ['Neu','Box 1','Box 2','Box 3','Box 4','Box 5','Box 6'];
const LS_KEY = 'palabras-srs-v1';

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function esHTML(s){
  return esc(s).replace(/(^|[\s\/])(el|los)(?= )/g,'$1<span class="art m">$2</span>').replace(/(^|[\s\/])(la|las)(?= )/g,'$1<span class="art f">$2</span>');
}
function exHTML(sentence, word){
  const parts = sentence.split(/([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)/);
  const w = word.toLowerCase();
  let done = false;
  return parts.map(p => {
    if(!done && p.toLowerCase() === w){ done = true; return '<b>' + esc(p) + '</b>'; }
    return esc(p);
  }).join('');
}
function speakable(s){ return s.replace(/\s*\(f\.\)/,'').replace(/\s*\/\s*/g,', '); }
function today(){ return Math.floor((Date.now() - new Date().getTimezoneOffset()*60000) / 86400000); }

function defaultState(){ return {v:1, t:0, cards:{}, cfg:{perDay:10, auto:true}, log:{}}; }
let S = defaultState();
let view = 'home';
let Q = [], sess = null, resetStage = 0, storeMode = 'none', dbRef = null, saveTimer = null, saving = false, dirty = false;

/* ---------- Speichern ---------- */
function lsLoad(){ try{ const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); return true; }catch(e){ return false; } }
function fix(o){
  const d = defaultState();
  if(!o || typeof o !== 'object') return d;
  d.t = +o.t || 0;
  d.cards = (o.cards && typeof o.cards === 'object') ? o.cards : {};
  d.cfg = Object.assign(d.cfg, o.cfg || {});
  delete d.cfg.dir;
  d.log = (o.log && typeof o.log === 'object') ? o.log : {};
  return d;
}
function setStore(mode){
  storeMode = mode;
  const el = $('#store');
  el.textContent = mode === 'cloud' ? 'Fortschritt ist in deinem Konto gespeichert.'
    : mode === 'local' ? 'Fortschritt nur in diesem Browser gespeichert. Sichere ihn unter Einstellungen.'
    : 'Fortschritt kann hier nicht gespeichert werden. Sichere ihn unter Einstellungen.';
}
function save(){
  S.t = Date.now();
  const ok = lsSave();
  if(!dbRef) setStore(ok ? 'local' : 'none');
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushCloud, 700);
}
async function pushCloud(){
  if(!dbRef || saving || !dirty) return;
  saving = true; dirty = false;
  try{ await dbRef.set({s: JSON.stringify(S), t: S.t}); setStore('cloud'); }
  catch(e){ setStore(lsSave() ? 'local' : 'none'); }
  saving = false;
  if(dirty) pushCloud();
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
async function initCloud(){
  try{
    if(typeof claude === 'undefined' || !claude.use) return;
    const db = await withTimeout(claude.use('db'), 10000);
    const user = await withTimeout(claude.use('user'), 10000);
    if(!db || !user) return;
    const id = await user.id();
    const ref = db.doc('data/users/' + id + '/srs');
    const snap = await withTimeout(ref.get(), 10000);
    const ex = typeof snap.exists === 'function' ? snap.exists() : snap.exists;
    if(ex){
      const d = typeof snap.data === 'function' ? snap.data() : snap.data;
      const remote = fix(JSON.parse(d.s));
      if(remote.t > S.t){ S = remote; lsSave(); if(view !== 'session') render(); }
    }
    dbRef = ref;
    if(S.t > 0){ dirty = true; pushCloud(); } else setStore('cloud');
  }catch(e){ /* weiter mit lokalem Speicher */ }
}

/* ---------- Statistik ---------- */
function newRemaining(){
  const L = S.log[today()] || {};
  return Math.max(0, S.cfg.perDay + (L.x || 0) - (L.n || 0));
}
function stats(){
  const t = today();
  const box = [0,0,0,0,0,0,0], fc = new Array(7).fill(0);
  let due = 0, learned = 0;
  for(const k in S.cards){
    const c = S.cards[k], b = c[0];
    if(b >= 1){ learned++; box[b]++; if(c[1] <= t) due++; else if(c[1] - t <= 7) fc[c[1] - t - 1]++; }
  }
  box[0] = N - learned;
  const fresh = Math.min(newRemaining(), box[0]);
  return {box, fc, due, learned, fresh};
}
function when(days){ return days <= 0 ? 'gleich' : days === 1 ? 'morgen' : 'in ' + days + ' Tagen'; }
function nextBox(box, g){
  if(g === 0) return 1;
  if(box === 0) return g === 2 ? 4 : 2;
  return Math.min(6, box + (g === 2 ? 2 : 1));
}

/* ---------- Sitzung ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildQueue(){
  const t = today(), due = [];
  for(const k in S.cards){ const c = S.cards[k]; if(c[0] >= 1 && c[1] <= t) due.push(+k); }
  shuffle(due); due.sort((a,b) => S.cards[a][1] - S.cards[b][1]);
  const fresh = [], want = newRemaining();
  for(let r = 1; r <= N && fresh.length < want; r++) if(!S.cards[r]) fresh.push(r);
  return due.concat(fresh);
}
function pickDir(){ return 'de'; }
function startSession(){
  Q = buildQueue();
  if(!Q.length) return;
  sess = {total: Q.length, done: 0, again: 0, good: 0, revealed: false, dir: pickDir()};
  view = 'session'; render();
}
function reveal(){
  if(!sess || sess.revealed) return;
  sess.revealed = true; render();
  if(S.cfg.auto !== false) speak();
}
function grade(g){
  if(!sess || !sess.revealed || !Q.length) return;
  const t = today(), r = Q.shift();
  let c = S.cards[r]; const isNew = !c;
  if(!c) c = [0, t, 0, 0];
  const L = S.log[t] || (S.log[t] = {n:0, r:0, x:0});
  if(isNew) L.n++; else L.r++;
  if(g === 0 && c[0] >= 2) c[3]++;
  c[0] = nextBox(c[0], g);
  c[1] = t + INT[c[0]];
  c[2]++;
  S.cards[r] = c;
  if(g === 0){ sess.again++; Q.splice(Math.min(Q.length, 3 + Math.floor(Math.random()*3)), 0, r); }
  else { sess.good++; sess.done++; }
  sess.revealed = false; sess.dir = pickDir();
  save();
  if(!Q.length){ view = 'done'; }
  render();
}

/* ---------- Ansichten ---------- */
function homeHTML(){
  const s = stats(), n = s.due + s.fresh;
  const segs = s.box.map((c,i) => c ? `<i style="width:${c/N*100}%;background:var(--b${i})"></i>` : '').join('');
  const legend = s.box.map((c,i) => `<li><span class="sw" style="background:var(--b${i})"></span><span>${BOXNAME[i]} <small>${i===0?'noch nicht gesehen':i===1?'heute wieder':'Abstand '+INT[i]+(INT[i]===1?' Tag':' Tage')}</small></span><b>${c}</b></li>`).join('');
  const mx = Math.max(1, ...s.fc);
  const fc = s.fc.map((c,i) => {
    const d = new Date(Date.now() + (i+1)*86400000);
    return `<div><em>${c||''}</em><i style="height:${Math.max(3, c/mx*48)}px"></i>${esc(d.toLocaleDateString('de-CH',{weekday:'short'}))}</div>`;

    if(nextDay >= 0) hint += ` Nächste Karten: ${nextDay === 0 ? 'morgen' : 'in ' + (nextDay+1) + ' Tagen'} (${s.fc[nextDay]}).`;
  }
  return `

    <ul class="legend">${legend}</ul>
  </div>
  <div class="card">
    <h2>Fällig in den nächsten 7 Tagen</h2>
    <div class="fc">${fc}</div>
  </div>`;
}

function sessionHTML(){
  const r = Q[0], w = WORDS[r-1], c = S.cards[r], isNew = !c;
  const front = w[1], back = w[2], note = w[3];
  const pct = sess.total ? Math.round(sess.done / sess.total * 100) : 0;
  const canSay = true;
  const sayBtn = canSay && sess.revealed
    ? `<button class="say" data-act="say" type="button" aria-label="Aussprache anhören"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>` : '';
  let body = `<div class="flash">
      <div class="dirtag">Deutsch → Spanisch ${isNew ? '<span class="chip">neu</span>' : ''}</div>
      <div class="word de" lang="de">${esc(front)}</div>
      <div class="exde" lang="de">${esc(w[5])}</div>
      ${sess.revealed ? `<div class="ans" lang="es">${esHTML(back)}${note ? `<span class="sub2">${esc(note)}</span>` : ''}</div>
      <div class="ex"><span class="es" lang="es">${exHTML(w[4], w[0])}</span></div>` : ''}
      ${sayBtn}
    </div>`;
  if(!sess.revealed){
    body += `<button class="btn" data-act="reveal" type="button">Antwort zeigen</button><p class="hint">Leertaste oder Enter</p>`;
  } else {
    const b = c ? c[0] : 0;
    const lbl = g => when(g === 0 ? 0 : INT[nextBox(b, g)]);
    body += `<div class="grades">
      <button class="grade again" data-act="grade" data-g="0" type="button">Nochmal<small>${lbl(0)}</small></button>
      <button class="grade" data-act="grade" data-g="1" type="button">Gewusst<small>${lbl(1)}</small></button>
      <button class="grade easy" data-act="grade" data-g="2" type="button">Leicht<small>${lbl(2)}</small></button>
    </div><p class="hint">Tasten 1, 2, 3</p>`;
  }
  return `<div class="sesshead"><span>${sess.done} von ${sess.total} erledigt</span><button class="btn ghost small" data-act="quit" type="button">Beenden</button></div>
    <div class="prog"><i style="width:${pct}%"></i></div>${body}`;
}

function doneHTML(){
  const s = stats();
  const nextDay = s.fc.findIndex(x => x > 0);
  return `<div class="card">
    <h2>Fertig für jetzt</h2>
    <p style="margin:0 0 6px">${sess.total} Karten erledigt, ${sess.again} davon mussten wiederholt werden.</p>
    <p class="note" style="margin:0">${nextDay >= 0 ? `Nächste Karten ${nextDay === 0 ? 'morgen' : 'in ' + (nextDay+1) + ' Tagen'}: ${s.fc[nextDay]}.` : 'Es sind keine weiteren Karten geplant.'}</p>
  </div>
  <button class="btn" data-act="home" type="button">Zur Übersicht</button>`;
}

function wordsHTML(){
  return `<input id="q" class="search" type="search" placeholder="Wort suchen, Spanisch oder Deutsch" autocomplete="off" aria-label="Wort suchen">
    <div id="list" class="list"></div>`;
}
function renderList(){
  const q = norm(($('#q') || {value:''}).value.trim());
  const rows = [];
  for(let i = 0; i < N; i++){
    const w = WORDS[i];
    if(q && !norm(w[0]).includes(q) && !norm(w[1]).includes(q)) continue;
    const c = S.cards[i+1], b = c ? c[0] : 0;
    rows.push(`<div class="item" data-act="clip" data-r="${i+1}" role="button" tabindex="0"><span class="n">${i+1}</span><div><b lang="es">${esHTML(w[2])}</b><span>${esc(w[1])}</span></div><i class="dot" style="background:var(--b${b})" title="${BOXNAME[b]}"></i></div>`);
  }
  $('#list').innerHTML = rows.length ? rows.join('') : '<div class="item"><span></span><span>Nichts gefunden.</span><span></span></div>';
}

}

function render(){
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === view)));
  $('#tabs').hidden = (view === 'session' || view === 'done' || EX.busy());
  const m = $('#main');
  m.innerHTML = view === 'home' ? homeHTML() : view === 'session' ? sessionHTML() : view === 'done' ? doneHTML()
    : view === 'ex' ? EX.html() : view === 'words' ? wordsHTML() : settingsHTML();
  if(view === 'words'){ renderList(); $('#q').addEventListener('input', renderList); }
  if(view === 'session') preload();
  window.scrollTo(0, 0);
  EX.after();
}

/* ---------- Aktionen ---------- */
let ttsNs = null, curClip = null;
const clips = {};
function getClip(r){
  let a = clips[r];
  if(!a){
    if(!(window.CLIPS && window.CLIPS[r])) return null;
    a = new Audio('data:audio/mpeg;base64,' + window.CLIPS[r]); a.preload = 'auto'; clips[r] = a;
  }
  return a;
}
function preload(){ if(Q.length){ getClip(Q[0]); if(Q[1]) getClip(Q[1]); } }
async function playClip(r){
  try{
    if(curClip){ curClip.pause(); }
    const a = getClip(r); if(!a) return false; curClip = a; a.currentTime = 0;
    await a.play();
    return true;
  }catch(e){ return false; }
}
async function speak(r){
  r = r || (Q.length ? Q[0] : 0);
  if(!r) return;
  if(await playClip(r)) return;
  const txt = speakable(WORDS[r-1][2]);
  if(ttsNs){
    try{ await ttsNs.speak(txt, {language:'es-ES'}); return; }
    catch(e){ if(e && (e.code === 'busy' || e.code === 'rate_limited' || e.code === 'viewer_stopped')) return; }
  }
  try{
    const u = new SpeechSynthesisUtterance(txt); u.lang = 'es-ES';
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
async function initTts(){
  try{
    if(typeof claude === 'undefined' || !claude.use) return;
    const t = await withTimeout(claude.use('tts'), 10000);
    if(t){ ttsNs = t; if(view === 'session') render(); }
  }catch(e){}
}
async function copyBackup(){
  const msg = $('#copymsg');
  try{ await navigator.clipboard.writeText(JSON.stringify(S)); msg.textContent = 'Sicherung kopiert. In eine Notiz einfügen und aufbewahren.'; }
  catch(e){ msg.textContent = 'Kopieren ist hier nicht möglich.'; }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a === 'view'){ view = b.dataset.v; resetStage = 0; EX.leave(); render(); }
  else if(a.startsWith('x-')) EX.act(a, b);
  else if(a === 'start') startSession();
  else if(a === 'reveal') reveal();
  else if(a === 'grade') grade(+b.dataset.g);
  else if(a === 'quit'){ view = 'home'; sess = null; Q = []; render(); }
  else if(a === 'home'){ view = 'home'; render(); }
  else if(a === 'say') speak();
  else if(a === 'clip') speak(+b.dataset.r);
  else if(a === 'more'){ const L = S.log[today()] || (S.log[today()] = {n:0,r:0,x:0}); L.x = (L.x||0) + 5; save(); render(); }
  else if(a === 'per'){ S.cfg.perDay = +b.dataset.n; save(); render(); }
  else if(a === 'auto'){ S.cfg.auto = b.dataset.v === '1'; save(); render(); }
  else if(a === 'mark'){
    const n = Math.max(1, Math.min(N, parseInt($('#known').value, 10) || 0)), t = today();
    let k = 0;
    for(let r = 1; r <= n; r++) if(!S.cards[r]){ S.cards[r] = [4, t + 3 + Math.floor(Math.random()*8), 1, 0]; k++; }
    save();
    $('#markmsg').textContent = k + ' Wörter als bekannt markiert.';
  }
  else if(a === 'copy') copyBackup();
  else if(a === 'reset1'){ resetStage = 1; render(); }
  else if(a === 'resetx'){ resetStage = 0; render(); }
  else if(a === 'reset2'){ S = defaultState(); resetStage = 0; save(); render(); }
});
document.addEventListener('keydown', e => {
  if(view !== 'session' || !sess) return;
  if(e.target && e.target.tagName === 'INPUT') return;
  if(!sess.revealed && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); reveal(); }
  else if(sess.revealed && ['1','2','3'].includes(e.key)){ e.preventDefault(); grade(+e.key - 1); }
});

      if(u.map(plain).join(' ') === r.map(plain).join(' ')){
        const w = r.filter((t, i) => t !== u[i]);
        return {ok:false, accent:true, msg:'Nur die Akzente stimmen nicht: ' + w.join(', ') + '.', keep:r.map((t, i) => t === u[i])};
      }
      return {ok:false, keep:lcsMask(u.map(plain), r.map(plain))};
    } else {
      const u = deTok(typed), r = deTok(s[1]);
      const a = deLoose(u.join(' ')), b = deLoose(r.join(' '));
      if(a === b) return {ok:true};
      const lim = Math.max(1, Math.floor(b.length / 14));
      if(lev(a, b) <= lim) return {ok:true, msg:'Kleiner Tippfehler, zählt trotzdem.'};
      return {ok:false, keep:lcsMask(u.map(deLoose), r.map(deLoose))};
    }
  }
  function solHTML(text, keep, isEs){
    const toks = text.split(/(\s+)/);
    let k = 0;
    return toks.map(p => {
      if(/^\s+$/.test(p) || !p) return p;
      const core = (isEs ? esTok(p) : deTok(p));
      if(!core.length) return esc(p);
      const ok = keep ? keep[k] : true; k++;
      return ok ? esc(p) : '<mark class="x-miss">' + esc(p) + '</mark>';
    }).join('');
  }

  /* Runde */
  function weight(dir, i){
    const s = X.st[dir][SKEY[i]];
    if(!s) return 3;
    const tot = s[0] + s[1];
    return 1 + 5 * s[1] / Math.max(1, tot) + (tot < 2 ? 1 : 0);
  }
  function pick(dir, cands){
    const ws = cands.map(i => weight(dir, i)), sum = ws.reduce((a, b) => a + b, 0);
    let x = Math.random() * sum, j = 0;
    while(j < cands.length - 1 && x >= ws[j]){ x -= ws[j]; j++; }
    return cands[j];
  }
  function start(kind){
    const P = pool(); if(P.length < 3) return;
    const tasks = [], used = new Set();
    for(let n = 0; n < X.cfg.len; n++){
      const dir = kind === 'mix' ? (Math.random() < .5 ? 'de2es' : 'es2de') : kind;
      let cands = P.filter(i => !used.has(i));
      if(!cands.length){ used.clear(); cands = P.slice(); }
      const i = pick(dir, cands); used.add(i);
      tasks.push({dir, i, retry:false});
    }
    ses = {kind, tasks, k:0, ok:0, total:0, missed:new Map(), answered:false, last:null};
    render();
  }
  const cur = () => ses.tasks[ses.k];
  function rec(t, ok, delta){
    const s = X.st[t.dir][SKEY[t.i]] || (X.st[t.dir][SKEY[t.i]] = [0,0]);
    const h = X.hist[today()] || (X.hist[today()] = [0,0]);
    if(delta){ s[1] = Math.max(0, s[1] - 1); s[0]++; h[1]++; ses.ok++; ses.missed.delete(t.dir + t.i); }
    else { ok ? s[0]++ : s[1]++; h[0]++; if(ok) h[1]++; ses.total++; if(ok) ses.ok++; else ses.missed.set(t.dir + t.i, t); }
    persist();
  }
  function submit(){
    if(!ses || ses.answered) return;
    const inp = $('#x-ans'); if(!inp || !inp.value.trim()) return;
    const t = cur(), res = check(t.dir, t.i, inp.value);
    ses.answered = true; ses.last = Object.assign({typed:inp.value.trim()}, res);
    if(!t.retry) rec(t, res.ok);
    if(!res.ok && !t.retry){
      const r = {dir:t.dir, i:t.i, retry:true};
      ses.tasks.splice(Math.min(ses.tasks.length, ses.k + 4), 0, r);
      ses.last.retryTask = r;
    }
    render();
  }
  function override(){
    if(!ses || !ses.answered || ses.last.ok) return;
    const t = cur();
    if(!t.retry) rec(t, true, true);
    if(ses.last.retryTask){ const p = ses.tasks.indexOf(ses.last.retryTask); if(p > ses.k) ses.tasks.splice(p, 1); }
    ses.last.ok = true; ses.last.self = true;
    render();
  }
  function next(){
    ses.k++; ses.answered = false; ses.last = null;
    if(ses.k >= ses.tasks.length) ses.done = true;
    render();
  }

  /* Ansichten */
  function homeHTML(){
    if(X.set === null && palabrasLearned().length) sync(true);
    const P = X.set ? pool() : [], n = (X.set || []).length, h = X.hist[today()] || [0,0], pend = pending(), ok = P.length >= 3;
    return `<div class="card">
      <div class="x-stats"><div><b>${P.length}</b><span>Sätze</span></div><div><b>${n}</b><span>Wörter</span></div><div><b>${h[0] ? h[1] + '/' + h[0] : '–'}</b><span>heute richtig</span></div></div>
      ${pend ? `<p class="note">In Palabras gibt es ${pend} neue Wörter. <button class="btn ghost small" data-act="x-sync" type="button">Synchronisieren</button></p>` : ''}
      ${msg ? `<p class="note" role="status">${esc(msg)}</p>` : ''}
    </div>
    <div class="x-stack">
      <button class="btn x-two" data-act="x-start" data-k="de2es" type="button" ${ok ? '' : 'disabled'}>Ins Spanische übersetzen<span>Deutscher Satz → Spanisch tippen</span></button>
      <button class="btn x-two" data-act="x-start" data-k="es2de" type="button" ${ok ? '' : 'disabled'}>Ins Deutsche übersetzen<span>Spanischer Satz → Deutsch tippen</span></button>
      <button class="btn ghost" data-act="x-start" data-k="mix" type="button" ${ok ? '' : 'disabled'}>Beide gemischt</button>
    </div>
    ${ok ? '' : '<p class="note">Lerne in Palabras noch ein paar Wörter, dann gibt es genug Sätze.</p>'}
    <p class="note">Die Sätze bestehen nur aus Wörtern, die du schon gelernt hast. Eine Runde hat ${X.cfg.len} Sätze, Fehler kommen in derselben Runde noch einmal.</p>`;
  }
  function taskHTML(){
    const t = cur(), s = SENT[t.i], L = ses.last;
    const pct = Math.round(ses.k / ses.tasks.length * 100);
    const toEs = t.dir === 'de2es';
    let fb = '';
    if(ses.answered){
      const sol = toEs ? s[0] : s[1];
      const title = L.ok ? (L.self ? 'Als richtig gewertet' : 'Richtig') : (L.accent ? 'Fast' : 'Nicht ganz');
      fb = `<div class="fb x-fb ${L.ok ? 'good' : 'bad'}">
          <strong>${title}</strong>
          <span class="x-sol" lang="${toEs ? 'es' : 'de'}">${L.ok && !L.keep ? esc(sol) : solHTML(sol, L.ok ? null : L.keep, toEs)}</span>
          ${L.msg ? `<span class="x-nt">${esc(L.msg)}</span>` : ''}
        </div>
        <div class="x-actions">
          ${!L.ok ? `<button class="btn ghost" data-act="x-self" type="button">Meine Antwort stimmt auch</button>` : ''}
          <button class="btn" data-act="x-next" type="button">${ses.k + 1 >= ses.tasks.length ? 'Ergebnis' : 'Weiter'}</button>
        </div>`;
    }
    const input = ses.answered
      ? `<div class="x-typed"><textarea id="x-ans" rows="2" class="${L.ok ? 'good' : 'bad'}" disabled aria-label="Deine Antwort">${esc(L.typed)}</textarea></div>`
      : `<div class="x-typed"><textarea id="x-ans" rows="2" lang="${toEs ? 'es' : 'de'}" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Übersetzung schreiben" aria-label="Deine Übersetzung"></textarea></div>
         ${toEs ? `<div class="x-keys" aria-label="Spanische Sonderzeichen">${KEYS.map(k => `<button class="x-key" data-act="x-key" data-ch="${k}" type="button" aria-label="Zeichen ${k}">${k}</button>`).join('')}</div>` : ''}
         <div class="x-actions"><button class="btn" data-act="x-submit" type="button">Prüfen</button></div>`;
    return `<div class="sesshead"><span>Satz ${ses.k + 1} von ${ses.tasks.length}</span><button class="btn ghost small" data-act="x-quit" type="button">Beenden</button></div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="x-task">
        <span class="x-label">${toEs ? 'Ins Spanische' : 'Ins Deutsche'}</span>${t.retry ? '<span class="x-label again">Nochmal</span>' : ''}
        <div class="x-prompt" lang="${toEs ? 'de' : 'es'}">${esc(toEs ? s[1] : s[0])}</div>
        ${input}${fb}
      </div>`;
  }
  function doneHTML(){
    const miss = Array.from(ses.missed.values()).map(t => {
      const s = SENT[t.i];
      return `<div class="x-miss-row"><b lang="es">${esc(s[0])}</b><span>${esc(s[1])}</span></div>`;
    }).join('');
    const pct = ses.total ? Math.round(ses.ok / ses.total * 100) : 0;
    return `<div class="card" style="text-align:center"><div class="x-score">${ses.ok} / ${ses.total}</div><p class="note">${pct} % beim ersten Versuch richtig</p></div>
      ${miss ? `<div class="card"><h2>Zum Nachschauen</h2>${miss}</div>` : '<div class="card" style="text-align:center">Alles richtig. Sehr gut.</div>'}
      <div class="x-actions"><button class="btn ghost" data-act="x-quit" type="button">Übersicht</button><button class="btn" data-act="x-start" data-k="${ses.kind}" type="button">Nochmal</button></div>`;
  }
  function settingsCard(){
    if(X.set === null && palabrasLearned().length) sync(true);
    const n = (X.set || []).length, P = X.set ? pool().length : 0, pend = pending();
    return `<div class="card">
      <h2>Übungen</h2>
      <p class="note" style="margin-top:0">Die Übungen nutzen ${n} Wörter und ${P} Sätze.${pend ? ` In Palabras sind ${pend} Wörter dazugekommen.` : ''}</p>
      <div class="row" style="margin-top:10px"><button class="btn small" data-act="x-sync" type="button">Synchronisieren</button></div>
      ${msg ? `<p class="note" role="status">${esc(msg)}</p>` : ''}
      <p class="note">Sätze pro Runde</p>
      <div class="seg">${LEN.map(v => `<button type="button" data-act="x-len" data-n="${v}" aria-pressed="${X.cfg.len === v}">${v}</button>`).join('')}</div>
    </div>`;
  }
  function html(){ return !ses ? homeHTML() : ses.done ? doneHTML() : taskHTML(); }
  function busy(){ return view === 'ex' && !!ses; }
  function after(){
    const i = $('#x-ans');
    if(view === 'ex' && i && !i.disabled) setTimeout(() => i.focus({preventScroll:true}), 30);
  }
  function insertChar(ch){
    const i = $('#x-ans'); if(!i || i.disabled) return;
    const s = i.selectionStart == null ? i.value.length : i.selectionStart, e = i.selectionEnd == null ? s : i.selectionEnd;
    i.value = i.value.slice(0, s) + ch + i.value.slice(e);
    try{ i.setSelectionRange(s + 1, s + 1); }catch(x){}
    i.focus({preventScroll:true});
  }
  function act(a, b){
    if(a === 'x-start'){ msg = ''; start(b.dataset.k); }
    else if(a === 'x-quit'){ ses = null; render(); }
    else if(a === 'x-submit') submit();
    else if(a === 'x-next') next();
    else if(a === 'x-self') override();
    else if(a === 'x-key') insertChar(b.dataset.ch);
    else if(a === 'x-sync'){ sync(false); render(); }
    else if(a === 'x-len'){ X.cfg.len = +b.dataset.n; persist(); render(); }
  }
  function onKey(e){
    if(view !== 'ex' || !ses || ses.done || e.key !== 'Enter' || e.shiftKey) return;
    e.preventDefault();
    ses.answered ? next() : submit();
  }
  function leave(){ msg = ''; }
  document.addEventListener('mousedown', e => { if(e.target.closest('.x-key')) e.preventDefault(); });
  document.addEventListener('pointerdown', e => { if(e.target.closest('.x-key')) e.preventDefault(); });
  document.addEventListener('keydown', onKey);
  X = fixX(lsLoad());
  return {html, busy, after, act, settingsCard, initCloud, leave, _check:check, _pool:pool, _state:() => X, _ses:() => ses};
})();
function lev(a, b){
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_, j) => j);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}

/* ---------- Start ---------- */
S = fix(lsLoad());
setStore(S.t > 0 ? (lsSave() ? 'local' : 'none') : 'local');
render();
initCloud();
initTts();
EX.initCloud();
</script>
